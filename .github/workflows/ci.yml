name: CI

# Actions 分钟按 job 向上取整计费，以下配置均为控制消耗：
# - 纯文档 PR（DEC-344）：必需检查照常触发但快速通过、不跑分片；判定见 changes job：
#   PR 相对 base 的完整改动文件必须全部是文档——任意目录的 *.md，或 docs/ reference/ .claude/ 下的
#   图片（png jpg jpeg gif svg webp）与纯文本资料（txt tsv）；其余扩展名（py mjs js ts json yml sh html 等）
#   不论在哪个目录都跑全量，.github/ 下任何文件也跑全量
# - push 到 main 的纯文档提交仍不触发（没有必需检查在等它，省分钟），口径与上面一致
# - 同一分支/PR 连续推送时取消旧运行，只验证最新提交
# - Draft PR 不跑，转 Ready 后再跑
# - Node 22（engines 下限）只在每周定时与手动触发时补跑，日常只跑 Node 24
# - 两种数据库各拆 3 片；lint/typecheck/build 只在每个 Node 的第 1 片跑
# - 必需检查名称由汇总 job 保留：纯文档时要求分片被跳过，其余情况要求分片全部成功，
#   分片失败/取消、或分类 job 失败（导致分片被连带跳过）都不放行
on:
  push:
    branches: [main]
    # paths 按顺序求值：先全选，再排除文档，最后把 .github/ 加回来（改 CI 必须跑）。
    # 与 changes job 的纯文档口径保持一致；GitHub 的 paths 过滤不支持花括号，故逐项列出。
    paths:
      - '**'
      - '!**.md'
      - '!docs/**.png'
      - '!docs/**.jpg'
      - '!docs/**.jpeg'
      - '!docs/**.gif'
      - '!docs/**.svg'
      - '!docs/**.webp'
      - '!docs/**.txt'
      - '!docs/**.tsv'
      - '!reference/**.png'
      - '!reference/**.jpg'
      - '!reference/**.jpeg'
      - '!reference/**.gif'
      - '!reference/**.svg'
      - '!reference/**.webp'
      - '!reference/**.txt'
      - '!reference/**.tsv'
      - '!.claude/**.png'
      - '!.claude/**.jpg'
      - '!.claude/**.jpeg'
      - '!.claude/**.gif'
      - '!.claude/**.svg'
      - '!.claude/**.webp'
      - '!.claude/**.txt'
      - '!.claude/**.tsv'
      - '.github/**'
  pull_request:
    # 不能加 paths-ignore：整条流程不触发会让必需检查永远挂起（DEC-344）
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 1 * * 1' # 每周一 09:00（北京时间）
  workflow_dispatch:
    inputs:
      node_22:
        description: 同时验证 Node 22（关闭可只校准 Node 24 分片耗时）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      generated_strict: ${{ steps.generated.outputs.strict }}
    steps:
      # 取 PR 合并提交及其两个父提交：HEAD^1 是 base，diff 即本 PR 相对 base 的完整改动
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            # -z 避免中文路径被转义；--no-renames 让“代码改名为文档”时旧路径也算改动
            if git diff -z --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.z"; then
              tr '\0' '\n' < "$RUNNER_TEMP/changed.z"
              # 改动列表为空按非纯文档处理，宁可多跑
              if [ -s "$RUNNER_TEMP/changed.z" ]; then
                docs_only=true
                while IFS= read -r -d '' f; do
                  case "$f" in
                    .github/*) docs_only=false ;;
                    *.md) ;;
                    # docs/ reference/ .claude/ 下只有图片和纯文本资料算文档；
                    # 脚本、json、html、yml 等（如 docs/10_进度/watch.py）走全量
                    docs/* | reference/* | .claude/*)
                      case "$f" in
                        *.png | *.jpg | *.jpeg | *.gif | *.svg | *.webp | *.txt | *.tsv) ;;
                        *) docs_only=false ;;
                      esac
                      ;;
                    *) docs_only=false ;;
                  esac
                done < "$RUNNER_TEMP/changed.z"
              fi
            else
              # git 本身出错（如缺父提交）时回退到全量，不让分类失败挡住合并
              echo "::warning::git diff 失败，回退为全量测试"
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
      # DEC-430①：生成物（F-039 冻结基准 / 发现探测 / 证据登记、端点计数）的新鲜度只在 main、定时 / 手动运行
      # 和“PR 头已包含最新 main”时判红（GENERATED_STRICT=1），其余 PR 只警告。
      # PR 检出的是 GitHub 的测试合并提交：HEAD^1 = base、HEAD^2 = PR 头。合并结果与 PR 头树相同，
      # 说明 base 的改动 PR 头都已含有（合并队列用 pnpm merge:main 准备好的队首 PR 就是这样），测的正是 PR 提交的生成物；
      # 用树比较而不是 merge-base --is-ancestor，fetch-depth 2 就够，不用拉全历史
      - id: generated
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          strict=1
          reason="$EVENT_NAME 运行"
          if [ "$EVENT_NAME" = pull_request ]; then
            if ! git rev-parse -q --verify 'HEAD^2' > /dev/null; then
              strict=0
              reason="取不到 PR 头提交，按未包含最新 main 处理"
            elif git diff --quiet 'HEAD^2' HEAD; then
              reason="PR 头已包含最新 main"
            else
              strict=0
              reason="PR 头未包含最新 main（合并前由队列 pnpm merge:main 重算）"
            fi
          fi
          mode=$([ "$strict" = 1 ] && echo "严格（不一致判红）" || echo "仅警告")
          echo "strict=$strict" | tee -a "$GITHUB_OUTPUT"
          echo "::notice title=生成物新鲜度::GENERATED_STRICT=$strict，$mode：$reason"
          echo "生成物新鲜度（DEC-430①）：GENERATED_STRICT=$strict，$mode；$reason" >> "$GITHUB_STEP_SUMMARY"
  check-shards:
    name: test (PGlite, Node ${{ matrix.node }}, shard ${{ matrix.shard }}/4)
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    # F-056 两轮实测最慢片 14m33s（含 quality/安装/收尾），25 分钟约为 1.72 倍；
    # 10-11 main 上第 1 片已到 21m44s（测试持续增长 + 第 1 片兼跑 lint/typecheck/build），改 4 片
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: >-
          ${{ fromJSON((github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.node_22)) && '[22, 24]' || '[24]') }}
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        if: matrix.shard == 1
      - run: pnpm typecheck
        if: matrix.shard == 1
      - run: pnpm test --shard=${{ matrix.shard }}/4
        env:
          GENERATED_STRICT: ${{ needs.changes.outputs.generated_strict }}
      - run: pnpm build
        if: matrix.shard == 1

  check:
    name: lint / typecheck / test (PGlite, Node ${{ matrix.node }})
    needs: [changes, check-shards]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    strategy:
      matrix:
        node: >-
          ${{ fromJSON((github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.node_22)) && '[22, 24]' || '[24]') }}
    steps:
      - name: Require every PGlite shard and quality check to succeed (skipped only for docs-only PRs)
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARDS_RESULT: ${{ needs.check-shards.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then test "$SHARDS_RESULT" = skipped; else test "$SHARDS_RESULT" = success; fi

  test-pg-shards:
    name: test (PostgreSQL 16, shard ${{ matrix.shard }}/4)
    needs: changes
    if: github.event.pull_request.draft != true && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    # F-056 首测最慢片 9m34s（含容器启动/安装/收尾），18 分钟约为 1.88 倍
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # Docker Hub 匿名拉取会限流（10-09 21:00Z 起 PG 分片批量失败），改用 AWS 公共镜像源的官方镜像，内容与 docker.io/library/postgres:16 相同
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: italent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 一次性容器内的测试口令，非机密
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/italent_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # 10-11 #226 合并后整库迁移 / 恢复单事务锁的表超过默认 max_locks_per_transaction=64（53200 out of shared memory）。
      # services 不能传 postgres 启动参数，改用 ALTER SYSTEM 写入后重启容器，再等健康检查通过
      - name: Raise max_locks_per_transaction
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do
            docker exec ${{ job.services.postgres.id }} pg_isready -U postgres && break
            sleep 1
          done
          docker exec ${{ job.services.postgres.id }} psql -U postgres -tAc "SHOW max_locks_per_transaction"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg --shard=${{ matrix.shard }}/4
        env:
          GENERATED_STRICT: ${{ needs.changes.outputs.generated_strict }}

  test-pg:
    name: test (PostgreSQL 16)
    needs: [changes, test-pg-shards]
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every PostgreSQL shard to succeed (skipped only for docs-only PRs)
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARDS_RESULT: ${{ needs.test-pg-shards.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then test "$SHARDS_RESULT" = skipped; else test "$SHARDS_RESULT" = success; fi

name: CI

# Actions 分钟按 job 向上取整计费，以下配置均为控制消耗：
# - 纯文档改动（*.md / docs / reference，均已被 prettier 忽略、测试不读取）不触发
# - 同一分支/PR 连续推送时取消旧运行，只验证最新提交
# - Draft PR 不跑，转 Ready 后再跑
# - Node 22（engines 下限）只在每周定时与手动触发时补跑，日常只跑 Node 24
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'reference/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**', 'reference/**']
  schedule:
    - cron: '0 1 * * 1' # 每周一 09:00（北京时间）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / test (PGlite, Node ${{ matrix.node }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[22, 24]' || '[24]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  test-pg:
    name: test (PostgreSQL 16)
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: italent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 一次性容器内的测试口令，非机密
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/italent_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:pg

<title>iTalent 进行中</title>
<style>
/* 由 board.py 生成：只改 看板数据.json 的 items / chains。
   布局：每条依赖链一行，从左到右是前序 → 当前 → 后续；同一列上下排列的是并行任务。
   配色：麦肯锡系（深蓝 / 电光蓝 / 青蓝 / 灰阶），与总体看板一致 */
:root{
  --bg:#f5f6f8;--panel:#fff;--sunk:#eef1f5;--ink:#051c2c;--ink2:#2b3a4a;--muted:#5f6b7a;--faint:#9aa5b1;--line:#e1e5ea;
  --ev:#5c7c99;--ds:#00a9f4;--dev:#2251ff;--rev:#051c2c;--mg:#7f93a8;--need:#d0453a;
  --ev-bg:#e9eef3;--ds-bg:#e1f5fd;--dev-bg:#e6ecff;--rev-bg:#e3e8ee;--mg-bg:#eef1f5;--need-bg:#fbe9e7;
  --on:#fff;
  --f:Arial,"Helvetica Neue","Noto Sans SC","PingFang SC",system-ui,sans-serif;--serif:Georgia,"Noto Serif SC","Songti SC",serif;--mono:ui-monospace,Menlo,"SF Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071722;--panel:#0d2231;--sunk:#12293a;--ink:#e8eef4;--ink2:#c3cfdb;--muted:#8a9bab;--faint:#5b6d7e;--line:#1d3446;
  --ev:#8fa9c2;--ds:#3cc4ff;--dev:#6f8dff;--rev:#c9d6e3;--mg:#7d93a8;--need:#f0796c;
  --ev-bg:#16293a;--ds-bg:#0f2f40;--dev-bg:#16264a;--rev-bg:#1a2c3c;--mg-bg:#12293a;--need-bg:#3a1c1a;
  --on:#071722;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071722;--panel:#0d2231;--sunk:#12293a;--ink:#e8eef4;--ink2:#c3cfdb;--muted:#8a9bab;--faint:#5b6d7e;--line:#1d3446;
  --ev:#8fa9c2;--ds:#3cc4ff;--dev:#6f8dff;--rev:#c9d6e3;--mg:#7d93a8;--need:#f0796c;
  --ev-bg:#16293a;--ds-bg:#0f2f40;--dev-bg:#16264a;--rev-bg:#1a2c3c;--mg-bg:#12293a;--need-bg:#3a1c1a;
  --on:#071722;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f);-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding-block:22px 32px;padding-inline:16px;display:grid;gap:18px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{margin:0;font:400 24px/1.15 var(--serif);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
.sub a{color:var(--muted)}
.tally{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2)}
.tally span{display:inline-flex;align-items:center;gap:6px}
.tally i{width:10px;height:10px;display:inline-block}
.tally b{font:700 16px var(--mono)}
.chains{display:grid;gap:10px}
.chain{background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:150px minmax(0,1fr)}
.ct{padding:12px 12px;border-right:1px solid var(--line);display:grid;align-content:start;gap:3px}
.ct b{font:400 15px/1.25 var(--serif)}
.ct span{font-size:11px;color:var(--muted)}
.flow{display:flex;align-items:center;gap:0;overflow-x:auto;padding:10px 12px}
.col{display:grid;gap:6px;flex:none}
.arr{flex:none;width:26px;height:2px;background:var(--faint);position:relative;margin:0 4px}
.arr::after{content:"";position:absolute;right:-1px;top:-4px;border-left:7px solid var(--faint);border-top:5px solid transparent;border-bottom:5px solid transparent}
.it{width:178px;border:1px solid var(--line);background:var(--panel);padding:7px 8px 8px;display:grid;gap:5px}
.it.need{border:2px solid var(--need);padding:6px 7px 7px}
.it.done{background:var(--sunk);border-color:transparent;width:150px;gap:2px}
.it.todo{border-style:dashed;width:150px;gap:2px}
.hd{display:flex;align-items:baseline;gap:6px;min-width:0}
.id{font:700 12px var(--mono);white-space:nowrap}
.done .id{color:var(--muted)}
.tg{margin-left:auto;font:700 9.5px/1.5 var(--mono);padding:0 4px;border:1px solid currentColor;white-space:nowrap}
.tg.fb{color:var(--ink)}
.tg.up{color:var(--dev)}
.tg.cx{color:var(--ds)}
.tg.sn{color:var(--ev)}
.nm{font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done .nm,.todo .nm{color:var(--muted)}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.sg{height:26px;display:flex;align-items:center;justify-content:center;font:700 15px var(--mono)}
.sg.n{background:repeating-linear-gradient(90deg,transparent 0 3px,var(--line) 3px 4px);opacity:.6}
.sg.w{border:1px dashed var(--faint);color:var(--faint);font-size:12px}
.sg.d{font-size:12px}
.now{font-size:11.5px;line-height:1.35;color:var(--ink)}
.need .now{color:var(--need);font-weight:700}
.wait{font-size:10.5px;color:var(--muted)}
.u{font-size:10.5px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:18px;height:12px;display:inline-block}
.nx{font-size:10.5px;color:var(--ds)}
.shelf{border:1px dashed var(--faint);background:var(--sunk)}
.shelf>summary{cursor:pointer;padding:10px 12px;font-size:12.5px;color:var(--ink2);list-style-position:inside}
.shelf>summary b{font:400 15px var(--serif);color:var(--ink);margin-right:8px}
.shelf .chains{padding:0 10px 10px;opacity:.78}
@media (max-width:640px){.chain{grid-template-columns:1fr}.ct{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:no-preference){.sg.a{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.82}}}
</style>
<div class="wrap">
  <header>
    <div><h1>进行中</h1><div class="sub">更新于 <span class="mono" id="upd"></span> · R3 主线：每行一条依赖链，前序 → 当前 → 后续；“→ 解锁”为跨链依赖 · <a href="https://claude.ai/artifact/Cv4XHGHSRYu1JAW96C2dtK">总体看板</a></div></div>
    <div class="tally" id="tally"></div>
  </header>
  <div class="lg" id="lg"></div>
  <div class="chains" id="chains"></div>
</div>
<script>
const DATA = __DATA__;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST = [["ev","取证"],["ds","设计"],["dev","开发"],["rev","审查"],["mg","合并"]];
const parse = s => Object.fromEntries((s || "").split(/\s+/).filter(Boolean).map(x => { const [k, v] = x.split(":"); return [k, {s: v[0], r: v.slice(1)}]; }));
const items = DATA.items || [];
const byId = Object.fromEntries(items.map(i => [i.id, i]));
const cur = it => { const p = parse(it.seg); const a = ST.find(([k]) => p[k] && p[k].s === "a"); return a ? a[0] : null; };
const seg = (k, x) => {
  if (!x || x.s === "n") return `<div class="sg n" title="不适用"></div>`;
  if (x.s === "w") return `<div class="sg w">${esc(x.r)}</div>`;
  const style = x.s === "a" ? `background:var(--${k});color:var(--on)` : `background:var(--${k}-bg);color:var(--${k})`;
  return `<div class="sg ${x.s}" style="${style}" title="${ST.find(s => s[0] === k)[1]}${x.r ? " 第 " + x.r + " 轮" : ""}">${x.s === "d" && !x.r ? "✓" : esc(x.r)}</div>`;
};
const card = it => {
  const head = `<div class="hd"><span class="id">${it.pr ? "#" + it.pr + " " : ""}${esc(it.id)}</span>${it.fable ? '<span class="tg fb">Fable</span>' : ""}${it.cx ? '<span class="tg cx">Codex</span>' : ""}${it.sn ? '<span class="tg sn">Sonnet</span>' : ""}${it.up ? `<span class="tg up" title="${esc(it.up)}">强度↑</span>` : ""}</div><div class="nm" title="${esc(it.n)}">${esc(it.n)}</div>${it.pd ? `<div class="u">${esc(it.pd)}</div>` : ""}`;
  if (it.k === "done") return `<div class="it done">${head}<div class="u">✓ ${esc(it.u)}</div></div>`;
  if (it.k === "todo") return `<div class="it todo">${head}<div class="u">${esc(it.u)}</div>${it.nx ? `<div class="nx">→ 解锁 ${esc(it.nx)}</div>` : ""}</div>`;
  const p = parse(it.seg);
  return `<div class="it${it.need ? " need" : ""}">${head}<div class="bar">${ST.map(([k]) => seg(k, p[k])).join("")}</div><div class="now">${esc(it.now)}</div>${it.wait ? `<div class="wait">等：${esc(it.wait)}</div>` : ""}${it.nx ? `<div class="nx">→ 解锁 ${esc(it.nx)}</div>` : ""}</div>`;
};
document.getElementById("upd").textContent = DATA.liveUpdated || DATA.updated || "";
const shelfG = new Set((DATA.chains || []).filter(c => c.sh).map(c => c.g));
const run = items.filter(i => i.k === "run" && !shelfG.has(i.g)), cnt = {}; run.forEach(i => { const c = cur(i); if (c) cnt[c] = (cnt[c] || 0) + 1; });
document.getElementById("tally").innerHTML = ST.map(([k, l]) => `<span><i style="background:var(--${k})"></i>${l}<b>${cnt[k] || 0}</b></span>`).join("") + `<span style="color:var(--need)"><i style="background:var(--need)"></i>等你处理<b>${run.filter(i => i.need).length}</b></span>`;
document.getElementById("lg").innerHTML = ST.map(([k, l]) => `<span><i style="background:var(--${k})"></i>${l}进行中</span>`).join("") + `<span><i style="background:var(--dev-bg)"></i>已完成（浅色）</span><span><i style="border:1px dashed var(--faint)"></i>待做</span><span>数字 = 第几轮</span><span><span class="tg sn" style="margin:0">Sonnet</span> Sonnet 实现（DEC-338）</span><span><span class="tg cx" style="margin:0">Codex</span> 旧分工在途的 Codex 开发</span><span>未标注 = Opus 设计 / 实现 · 审查：B 档 Sol、C 档 Astra</span><span><span class="tg up" style="margin:0">强度↑</span> 超过 3 轮已升强度</span>`;
const chainHtml = ch => {
  const cols = {}; items.filter(i => i.g === ch.g).forEach(i => (cols[i.o || 1] ||= []).push(i));
  const keys = Object.keys(cols).map(Number).sort((a, b) => a - b);
  return `<section class="chain"><div class="ct"><b>${esc(ch.t)}</b><span>${esc(ch.d || "")}</span></div><div class="flow">${keys.map(k => `<div class="col">${cols[k].map(card).join("")}</div>`).join('<div class="arr"></div>')}</div></section>`;
};
const live = (DATA.chains || []).filter(c => !c.sh), shelf = (DATA.chains || []).filter(c => c.sh);
const nShelf = items.filter(i => shelfG.has(i.g) && i.k !== "done").length;
document.getElementById("chains").innerHTML = live.map(chainHtml).join("") +
  (shelf.length ? `<details class="shelf"><summary><b>搁置中</b>DEC-297 聚焦 R3 · ${nShelf} 项未完成，进展保留 · 点开查看</summary><div class="chains">${shelf.map(chainHtml).join("")}</div></details>` : "");
</script>

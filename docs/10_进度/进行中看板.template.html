<title>iTalent 进行中</title>
<style>
/* 由 board.py 生成（build 时自动抓 GitHub 在途 PR 状态）。手工维护的只有 看板数据.json 的 main（主线与子 PR 计划）。
   从上到下：① 卡点与待你决定 ② 主线逐个子 PR ③ 支撑任务 ④ 其他在途（修正任务） ⑤ 今日合并 */
:root{
  --bg:#f5f6f8;--panel:#fff;--sunk:#eef1f5;--ink:#051c2c;--ink2:#2b3a4a;--muted:#5f6b7a;--faint:#9aa5b1;--line:#e1e5ea;
  --done:#051c2c;--done-ink:#fff;--rev:#2251ff;--rev-bg:#e6ecff;--q:#00a9f4;--q-bg:#e1f5fd;
  --work:#b26a00;--work-bg:#fff2dc;--bad:#d0453a;--bad-bg:#fbe9e7;--ok:#1f7a4d;--ok-bg:#e3f4ea;
  --f:"PingFang SC","Noto Sans SC","Helvetica Neue",Arial,system-ui,sans-serif;--mono:ui-monospace,Menlo,"SF Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071722;--panel:#0d2231;--sunk:#12293a;--ink:#e8eef4;--ink2:#c3cfdb;--muted:#8a9bab;--faint:#5b6d7e;--line:#1d3446;
  --done:#c9d6e3;--done-ink:#071722;--rev:#6f8dff;--rev-bg:#16264a;--q:#3cc4ff;--q-bg:#0f2f40;
  --work:#f0a640;--work-bg:#3a2a10;--bad:#f0796c;--bad-bg:#3a1c1a;--ok:#5fcf95;--ok-bg:#12321f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071722;--panel:#0d2231;--sunk:#12293a;--ink:#e8eef4;--ink2:#c3cfdb;--muted:#8a9bab;--faint:#5b6d7e;--line:#1d3446;
  --done:#c9d6e3;--done-ink:#071722;--rev:#6f8dff;--rev-bg:#16264a;--q:#3cc4ff;--q-bg:#0f2f40;
  --work:#f0a640;--work-bg:#3a2a10;--bad:#f0796c;--bad-bg:#3a1c1a;--ok:#5fcf95;--ok-bg:#12321f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);padding:20px 16px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-size:22px;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi b{font-size:16px;color:var(--ink);margin-right:3px}
.kpi.bad b{color:var(--bad)}
h2{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
section{min-width:0}
.sks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.sk{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--work);border-radius:8px;padding:8px 10px;min-width:0}
.sk.decide,.sk.ask{border-left-color:var(--bad);background:var(--bad-bg)}
.sk .h{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--muted)}
.sk .h b{color:var(--ink);font-family:var(--mono)}
.sk .w{font-weight:600;margin:2px 0}
.sk .t{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.none{color:var(--ok);background:var(--ok-bg);border-radius:8px;padding:8px 12px;font-size:13px}
.line{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.lh .nm{font-weight:700;font-size:15px}
.bar{flex:1 1 160px;max-width:260px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--done)}.bar .a{background:var(--rev)}
.pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.focus{font-size:12px;color:var(--ink2)}
.focus b{color:var(--bad)}
.pre{font-size:12px;color:var(--faint)}
.grp{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start}
.grp .gn{font-size:12px;color:var(--muted);padding-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.chip{display:inline-flex;align-items:baseline;gap:4px;border-radius:6px;padding:2px 7px;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);white-space:nowrap}
.chip .k{font-family:var(--mono);font-weight:700;font-size:11px}
.chip .p{font-family:var(--mono);font-size:10px;opacity:.75}
.chip.done{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.chip.review{background:var(--rev-bg);border-color:var(--rev);color:var(--rev)}
.chip.queue,.chip.ci{background:var(--q-bg);border-color:var(--q);color:var(--ink)}
.chip.merge{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.chip.dev{background:var(--rev-bg);border-style:dashed;border-color:var(--rev);color:var(--ink)}
.chip.rework{background:var(--work-bg);border-color:var(--work);color:var(--ink)}
.chip.decide,.chip.conflict,.chip.cired{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:600}
.chip.assigned{border-style:dashed;color:var(--ink2)}
.chip.todo{color:var(--faint);border-style:dotted}
.chip.wait{color:var(--faint);background:var(--sunk)}
.chip.paused{color:var(--faint);background:repeating-linear-gradient(135deg,var(--sunk) 0 5px,var(--panel) 5px 10px)}
.chip.stuck{box-shadow:0 0 0 2px var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11px;color:var(--muted);align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tblw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tbl td,.tbl th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:11px}
.tbl tr:last-child td{border-bottom:0}
.mono{font-family:var(--mono)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.log li{font-size:12px;color:var(--ink2);margin:2px 0}
@media (max-width:560px){.grp{grid-template-columns:1fr}.grp .gn{padding-top:0}.kpis{margin-left:0}}
</style>
<div class="wrap">
  <header>
    <h1>R3 进行中</h1>
    <span class="sub" id="at"></span>
    <div class="kpis" id="kpis"></div>
  </header>
  <section><h2>卡点与待你决定</h2><div id="stuck"></div></section>
  <section>
    <h2>主线</h2>
    <div class="legend" id="legend"></div>
    <div id="lines" style="display:flex;flex-direction:column;gap:10px;margin-top:8px"></div>
  </section>
  <section><h2>支撑任务</h2><div id="support" style="display:flex;flex-direction:column;gap:10px"></div></section>
  <section><h2>其他在途（修正任务等）</h2><div id="others"></div></section>
  <section><h2>今日已合并</h2><div id="today"></div></section>
  <section><details><summary>最近动态</summary><ul class="log" id="log"></ul></details></section>
</div>
<script>
const DATA = __DATA__;
const L = DATA.live || {open: [], merged: {}, today: [], at: "—"};
const M = DATA.main || {lines: [], support: [], asks: []};
const OPEN = {}; (L.open || []).forEach(p => OPEN[p.n] = p);
const NAME = {done:"已合并",review:"审查中",rework:"返工中",merge:"待合并",queue:"待发起审查",ci:"等 CI",dev:"开发中",decide:"待你决定",conflict:"与 main 冲突",cired:"CI 红",assigned:"已派",todo:"待派",wait:"等前置",paused:"暂停"};
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur = m => m == null ? "" : m >= 1440 ? Math.floor(m/1440) + " 天" : m >= 60 ? Math.floor(m/60) + " 小时" + (m%60 ? (m%60) + " 分" : "") : m + " 分";
const used = new Set();
function stepState(st){
  if (st.pr){
    used.add(st.pr);
    if (L.merged && L.merged[st.pr]) return {s:"done"};
    const o = OPEN[st.pr];
    if (o) return {s:o.s, o};
  }
  return {s: st.s || "todo"};
}
function chip(st){
  const x = stepState(st), o = x.o;
  const tip = [st.k + " " + st.n, NAME[x.s] || x.s, st.pr ? "#" + st.pr : "", o ? o.why + (o.idle < 1e5 ? " · " + dur(o.idle) + "无动静" : "") : "", st.note || ""].filter(Boolean).join(" · ");
  return `<span class="chip ${x.s}${o && o.stuck ? " stuck" : ""}" title="${esc(tip)}"><span class="k">${esc(st.k)}</span>${esc(st.n)}${st.pr ? `<span class="p">#${st.pr}</span>` : ""}</span>`;
}
function block(l){
  const gs = l.groups || (l.steps ? [{n:"", steps:l.steps}] : []);
  const all = [].concat(...gs.map(g => g.steps));
  const ss = all.map(stepState);
  const done = ss.filter(x => x.s === "done").length, act = ss.filter(x => !["done","todo","wait","paused","assigned"].includes(x.s)).length;
  const tot = all.length;
  const hot = all.map((st,i) => [st, ss[i]]).filter(p => p[1].o).map(p => (p[1].o.stuck ? "<b>" : "") + esc(p[0].k) + " " + (NAME[p[1].s]||p[1].s) + (p[1].o.stuck ? "</b>" : "")).join("；");
  const nextTodo = all.find((st,i) => ["todo","assigned","wait"].includes(ss[i].s));
  const idleLine = tot && !act && done < tot;
  const focus = tot === 0 ? "已完成" : hot ? "在途：" + hot : idleLine ? "<b>当前没有在途 PR</b>" + (nextTodo ? "，下一步 " + esc(nextTodo.k + " " + nextTodo.n) + (nextTodo.note ? "（" + esc(nextTodo.note) + "）" : "") : "") : "";
  const groups = gs.map(g => `<div class="grp"><div class="gn">${esc(g.n)}</div><div class="chips">${g.steps.map(chip).join("")}</div></div>`).join("");
  return `<div class="line"><div class="lh"><span class="nm">${esc(l.name)}</span>` +
    (tot ? `<span class="bar"><i class="d" style="width:${100*done/tot}%"></i><i class="a" style="width:${100*act/tot}%"></i></span><span class="pct">${done}/${tot} 已合并${act ? " · " + act + " 在途" : ""}</span>` : "") +
    (l.why ? `<span class="pre">${esc(l.why)}</span>` : "") + `</div>` +
    (focus ? `<div class="focus">${focus}</div>` : "") + (l.pre ? `<div class="pre">前置：${esc(l.pre)}</div>` : "") + groups + `</div>`;
}
document.getElementById("lines").innerHTML = (M.lines || []).map(block).join("");
document.getElementById("support").innerHTML = (M.support || []).map(block).join("");
const legendKeys = ["done","review","merge","queue","dev","rework","decide","conflict","cired","assigned","todo","wait","paused"];
document.getElementById("legend").innerHTML = legendKeys.map(k => `<span class="chip ${k}">${NAME[k]}</span>`).join("") + `<span>红框 = 卡住（冲突 / CI 红 / 待决定 / 超时无动静）；把鼠标停在格子上看详情</span>`;
const stuck = (L.open || []).filter(p => p.stuck).sort((a,b) => (b.s === "decide") - (a.s === "decide") || b.idle - a.idle);
const asks = (M.asks || []).map(a => `<div class="sk ask"><div class="h"><b>待你</b><span>${esc(a.where)}</span></div><div class="w">${esc(a.t)}</div><div class="t">${esc(a.note || "")}</div></div>`);
const sks = stuck.map(p => `<div class="sk ${p.s}"><div class="h"><b>#${p.n}</b><span>${esc(NAME[p.s] || p.s)}${p.idle < 1e5 ? " · " + dur(p.idle) + "无动静" : ""}</span></div><div class="w">${esc(p.why)}</div><div class="t">${esc(p.t)}</div></div>`);
document.getElementById("stuck").innerHTML = (asks.length + sks.length) ? `<div class="sks">${asks.concat(sks).join("")}</div>` : `<div class="none">当前没有卡住的 PR，也没有待你决定的事项。</div>`;
const others = (L.open || []).filter(p => !used.has(p.n));
document.getElementById("others").innerHTML = others.length ? `<div class="tblw"><table class="tbl"><tr><th>PR</th><th>内容</th><th>状态</th><th>轮次</th><th>无动静</th></tr>` +
  others.map(p => `<tr><td class="mono">#${p.n}</td><td>${esc(p.t)}</td><td><span class="chip ${p.s}${p.stuck ? " stuck" : ""}">${esc(NAME[p.s] || p.s)}</span> ${esc(p.why)}</td><td>${p.r}</td><td>${dur(p.idle)}</td></tr>`).join("") + `</table></div>` : `<div class="none">没有主线外的在途 PR。</div>`;
const td = L.today || [];
document.getElementById("today").innerHTML = td.length ? `<div class="tblw"><table class="tbl">` + td.map(m => `<tr><td class="mono">${esc(m.at)}Z</td><td class="mono">#${m.n}</td><td>${esc(m.t)}</td></tr>`).join("") + `</table></div>` : `<div class="pre">今天还没有合并。</div>`;
document.getElementById("log").innerHTML = (DATA.log || []).map(x => `<li>${esc(x[0])}　${esc(x[1])}</li>`).join("");
const nStuck = stuck.length + (M.asks || []).length, nRev = (L.open || []).filter(p => p.s === "review").length, nWork = (L.open || []).filter(p => p.s === "rework").length;
document.getElementById("kpis").innerHTML = `<span class="kpi${nStuck ? " bad" : ""}"><b>${nStuck}</b>卡点</span><span class="kpi"><b>${nRev}</b>审查中</span><span class="kpi"><b>${nWork}</b>返工</span><span class="kpi"><b>${(L.open || []).length}</b>在途 PR</span><span class="kpi"><b>${td.length}</b>今日合并</span>`;
document.getElementById("at").textContent = "GitHub 状态取自 " + (L.at || "—") + "（发布时刷新）";
</script>

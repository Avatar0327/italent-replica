<title>iTalent 复刻进度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 布局：要你处理 → 阶段 / 子阶段 / 任务的逐层穿透树（主视图）→ 依赖主线 → 进行中的长流程 PR → 最近动态。像施工进度台账：先看卡在哪，再逐层点开看为什么。 */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --sunk:#eef1ef; --ink:#1d2421; --muted:#5f6b66; --line:#dfe4e1;
  --accent:#1f6f5c; --accent-soft:#e3f0ec;
  --done:#2e7d4f; --active:#b26a00; --review:#2b5fa8; --todo:#7d8984; --blocked:#b23a3a;
  --done-bg:#e6f3ea; --active-bg:#fbf0de; --review-bg:#e5edf9; --todo-bg:#eef1ef; --blocked-bg:#f8e6e6;
  --codex:#6a4bb0; --codex-bg:#efe9fa; --claude:#a4532a; --claude-bg:#f8ebe2;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a201d; --sunk:#161b19; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2b3430;
  --accent:#5cc3a6; --accent-soft:#1d3029;
  --done:#6fcf97; --active:#f0b14d; --review:#7fa8e8; --todo:#8a9690; --blocked:#e88080;
  --done-bg:#1b2d22; --active-bg:#33270f; --review-bg:#1a2536; --todo-bg:#1f2522; --blocked-bg:#361d1d;
  --codex:#b79cf0; --codex-bg:#2a2140; --claude:#eba27c; --claude-bg:#3a2519; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a201d; --sunk:#161b19; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2b3430;
  --accent:#5cc3a6; --accent-soft:#1d3029;
  --done:#6fcf97; --active:#f0b14d; --review:#7fa8e8; --todo:#8a9690; --blocked:#e88080;
  --done-bg:#1b2d22; --active-bg:#33270f; --review-bg:#1a2536; --todo-bg:#1f2522; --blocked-bg:#361d1d;
  --codex:#b79cf0; --codex-bg:#2a2140; --claude:#eba27c; --claude-bg:#3a2519; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:24px}
h1{font:700 26px/1.25 var(--f-display);margin:0;text-wrap:balance}
h2{font:700 17px/1.3 var(--f-display);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:104px}
.stat b{display:block;font:600 20px/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.mode{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:13px;display:grid;gap:4px}
.mode b{color:var(--accent)}
.sec-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between;margin-bottom:10px}

/* 状态与标签 */
.pill{display:inline-block;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap}
.s-done{color:var(--done);background:var(--done-bg)} .s-active{color:var(--active);background:var(--active-bg)}
.s-review{color:var(--review);background:var(--review-bg)} .s-todo{color:var(--todo);background:var(--todo-bg)}
.s-blocked,.s-ready{color:var(--blocked);background:var(--blocked-bg)}
.who{display:inline-flex;gap:3px;align-items:center;font:500 11px var(--f-mono);white-space:nowrap}
.who i{font-style:normal;padding:0 6px;border-radius:4px}
.w-Codex{color:var(--codex);background:var(--codex-bg)} .w-Claude{color:var(--claude);background:var(--claude-bg)}
.tag{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--blocked)}
.ms-tag{font:500 11px var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:4px;white-space:nowrap}
a{color:var(--accent)}

/* 要你处理 */
.attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.attn .it{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.attn .it.you{border-color:var(--blocked)}
.attn .k{font:600 12px var(--f-mono);display:flex;gap:8px;align-items:center;justify-content:space-between}
.attn p{margin:0;font-size:13px}
.attn .nx{font-size:12.5px;color:var(--muted)}

/* 可穿透元素：统一用左侧箭头 + “点开”提示 + 悬停底色标识 */
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px;color:var(--muted)}
.drill-hint{display:inline-flex;gap:4px;align-items:center;color:var(--accent);font-weight:500}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.chev{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;flex:none;transition:transform .15s}
details[open]>summary .chev{transform:rotate(90deg)}
summary:hover{background:var(--sunk)}
summary:focus-visible,.jump:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jump{cursor:pointer;border:1px dashed var(--accent);background:transparent;color:var(--ink);border-radius:6px;padding:1px 7px;font:500 12px var(--f-mono);display:inline-flex;gap:5px;align-items:center}
.jump:hover{background:var(--accent-soft)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.chev{transition:none}}

/* 阶段树 */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage-h{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.stage-h b{font:700 16px var(--f-display)}
.bar{flex:1;min-width:120px;height:6px;border-radius:3px;background:var(--todo-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done)}
.ms>summary{display:grid;grid-template-columns:auto 52px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.ms:first-of-type>summary{border-top:0}
.ms .mk{font:600 13px var(--f-mono)}
.ms .mt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;min-width:0}
.ms .mt span:first-child{font-weight:500}
.ms .mr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tasks{background:var(--sunk);padding:6px 10px 10px 16px;display:grid;gap:6px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.task>summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:8px}
.task .tl{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;min-width:0}
.task .tid{font:600 12.5px var(--f-mono)}
.task .tr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.detail{border-top:1px solid var(--line);padding:10px 12px 12px 40px;display:grid;gap:10px;font-size:13px}
.blk{display:grid;gap:4px;min-width:0}
.blk h4{margin:0;font:600 12px var(--f-body);color:var(--muted);letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fix{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:6px 8px;border-left:3px solid var(--line);background:var(--sunk);border-radius:0 6px 6px 0}
.fix .fh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ev{display:grid;grid-template-columns:72px 80px minmax(0,1fr);gap:8px;font-size:12.5px}
.ev .lv{color:var(--muted)}
.empty{color:var(--muted);font-size:12.5px}

/* 依赖主线 */
.lanes{display:grid;gap:10px}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.lane .ln{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.lane .ln b{font:700 15px var(--f-display)}
.lane .ln span{font-size:12.5px;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.step{display:flex;flex-direction:column;gap:6px}
.arrow{align-self:center;color:var(--muted);padding:0 2px}
.node{cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:160px;max-width:230px;display:grid;gap:3px;font:inherit;font-size:12.5px;background:var(--bg);color:var(--ink)}
.node:hover{border-color:var(--accent)}
.node.wait{border-style:dashed}
.node.ready{border:2px solid var(--blocked)}
.node .nid{font:600 12.5px var(--f-mono);display:flex;gap:6px;align-items:center;justify-content:space-between}
.node .w{color:var(--muted);font-size:12px}

/* 长流程 PR */
.longpr{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.rounds{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rounds li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:2px 12px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.rounds li:first-child{border-top:0}
.rounds .rk{display:grid;gap:2px;font-weight:500}
.rounds time{font:400 12px var(--f-mono);color:var(--muted)}

.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
.log ol{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.log li:last-child{border-bottom:0}
.log time{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.more{margin-top:6px;font:inherit;font-size:12.5px;color:var(--accent);background:none;border:0;cursor:pointer;padding:4px 0}

@media (max-width:620px){
  h1{font-size:22px}
  .ms>summary{grid-template-columns:auto 44px minmax(0,1fr)}
  .ms .mr{grid-column:2 / -1;justify-content:flex-start}
  .task>summary{grid-template-columns:auto minmax(0,1fr)}
  .task .tr{grid-column:2;justify-content:flex-start}
  .detail{padding-left:12px}
  .ev{grid-template-columns:64px minmax(0,1fr)}.ev .lv{display:none}
  .flow{flex-direction:column}.arrow{transform:rotate(90deg)}.node{max-width:none}
  .rounds li,.log li{grid-template-columns:1fr}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>北森 iTalent 复刻 · 开发进度</h1>
      <div class="sub">更新于 <span class="mono" id="updated"></span> · 仓库 <span class="mono">Avatar0327/italent-replica</span> · 进度窗口维护</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="mode" id="mode"></div>

  <section>
    <div class="sec-head"><h2>要你处理 / 下一步</h2><span class="sub">红框 = 需要你本人决定或操作</span></div>
    <div class="attn" id="attn"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>阶段 · 子阶段 · 任务</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="sub" style="margin-bottom:10px">R 是大阶段，M 是 R1 下的子阶段。<span class="drill-hint"><span class="chev" aria-hidden="true">▶</span>可点开</span>的行逐层展开：子阶段 → 任务 → 修正任务、PR 轮次、待取证、依赖。虚线框的任务号可点击跳转。</div>
    <div id="tree" style="display:grid;gap:12px"></div>
  </section>

  <section>
    <div class="sec-head"><h2>依赖主线</h2><span class="sub">谁在挡谁；点任一方块跳到上面的任务</span></div>
    <div class="lanes" id="lanes"></div>
  </section>

  <section id="longpr-sec">
    <div class="sec-head"><h2>进行中的长流程 PR</h2><span class="sub">审查达 3 轮及以上时显示，合并后自动移除</span></div>
    <div id="longpr" style="display:grid;gap:10px"></div>
  </section>

  <section>
    <h2>最近动态</h2>
    <div class="log"><ol id="log"></ol><button class="more" id="logmore" type="button">显示全部</button></div>
  </section>
</div>

/* ===== 渲染 ===== */
const ST = {done:{t:"已完成",c:"s-done"}, review:{t:"审查中",c:"s-review"}, active:{t:"开发 / 修改中",c:"s-active"}, todo:{t:"未开始",c:"s-todo"}, blocked:{t:"受阻",c:"s-blocked"}};
const T = DATA.tasks;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill = s => `<span class="pill ${ST[s].c}">${ST[s].t}</span>`;
const ready = id => { const t = T[id]; return t && t.s === "todo" && !pending(id).length; };
const statePill = id => ready(id) && !T[id].hold ? `<span class="pill s-ready">可派发</span>` : (ready(id) ? `<span class="pill s-todo">可派发 · 暂缓</span>` : pill(T[id].s));
const pending = id => (T[id]?.deps || []).filter(d => T[d] && T[d].s !== "done");
const blocksOf = id => Object.keys(T).filter(k => (T[k].deps || []).includes(id) && T[k].s !== "done");
const msOf = id => T[id]?.ms || T[T[id]?.parent]?.ms;
const isF = id => !!T[id]?.parent;
const kids = id => Object.keys(T).filter(k => T[k].parent === id);
const evOf = id => DATA.evidence.filter(e => e.task === id);
const prLink = n => `<a href="https://github.com/Avatar0327/italent-replica/pull/${n}" target="_blank" rel="noopener">#${n}</a>`;
const who = t => t.dev ? `<span class="who"><i class="w-${t.dev}">${t.dev} 开发</i>${t.rev ? `<i class="w-${t.rev}">${t.rev} 审</i>` : ""}</span>` : "";
const jump = id => `<button class="jump" type="button" data-go="${esc(id)}">${esc(id)} ${T[id] ? pill(T[id].s) : ""}</button>`;
const domId = id => "t-" + id.replace(/[^A-Za-z0-9]/g, "_");

document.getElementById("updated").textContent = DATA.updated;
document.getElementById("mode").innerHTML = DATA.mode.map(x => `<div>${x}</div>`).join("");
document.getElementById("stats").innerHTML = DATA.stats.map(x => `<div class="stat"><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join("");
document.getElementById("legend").innerHTML = Object.keys(ST).map(pill).join("") + `<span class="pill s-ready">可派发</span><span class="who"><i class="w-Claude">Claude</i><i class="w-Codex">Codex</i></span>`;

/* 要你处理：手写条目 + 自动检查阶段优先级 */
const attn = [...DATA.attn];
const r1Ready = Object.keys(T).filter(id => (msOf(id) || "").startsWith("M") && ready(id) && !T[id].hold);
const crossActive = Object.keys(T).filter(id => /^R[23]/.test(msOf(id) || "") && ["active","review"].includes(T[id].s) && !T[id].cross);
if (crossActive.length && r1Ready.length) attn.unshift({you:true,k:"阶段优先级提醒",d:`R1 仍有可派发任务（${r1Ready.join("、")}），同时 ${crossActive.join("、")} 已在 R2/R3 开工`, nx:"请确认这是有意的跨阶段并行"});
document.getElementById("attn").innerHTML = attn.map(a => `<div class="it${a.you ? " you" : ""}"><div class="k">${esc(a.k)}${a.you ? `<span class="pill s-blocked">要你处理</span>` : ""}</div><p>${esc(a.d)}</p><div class="nx">下一步：${esc(a.nx)}</div></div>`).join("");

/* 任务详情：依赖、被挡、修正、PR、取证 */
function detail(id){
  const t = T[id], out = [];
  const pd = pending(id), bl = blocksOf(id);
  if (t.why) out.push(`<div class="blk"><h4>为什么要修正</h4><div>${esc(t.why)}；修正的是 ${jump(t.parent)}</div></div>`);
  if (t.note) out.push(`<div class="blk"><h4>说明</h4><div>${esc(t.note)}</div></div>`);
  if (t.hold) out.push(`<div class="blk"><h4>暂缓原因</h4><div>${esc(t.hold)}</div></div>`);
  out.push(`<div class="blk"><h4>前置任务</h4><div class="row">${(t.deps||[]).length ? t.deps.map(jump).join("") : `<span class="empty">无</span>`}${pd.length ? `<span class="tag warn">还在等 ${pd.length} 个</span>` : ""}</div></div>`);
  if (bl.length) out.push(`<div class="blk"><h4>它挡住的任务</h4><div class="row">${bl.map(jump).join("")}</div></div>`);
  const ks = kids(id);
  if (ks.length) out.push(`<div class="blk"><h4>修正任务（取证推翻后回头改）</h4>${ks.map(k => { const f = T[k], p = pending(k);
      return `<div class="fix" id="${domId(k)}"><span class="mono">${esc(k)}</span><div class="fh">${statePill(k)} <span>${esc(f.n)}</span> ${who(f)} ${(f.pr||[]).map(prLink).join(" ")} <span class="tag">${esc(f.why||"")}</span>${p.length ? `<span class="tag warn">等 ${p.join("、")}</span>` : ""}${f.hold ? `<span class="tag">${esc(f.hold)}</span>` : ""}</div></div>`; }).join("")}</div>`);
  const prs = (t.pr||[]).filter(n => DATA.prs[n]);
  if (prs.length) out.push(`<div class="blk"><h4>PR 进度</h4>${prs.map(n => { const p = DATA.prs[n];
      return `<div class="row">${prLink(n)} ${pill(p.s)} <span class="tag">第 ${p.round} 轮 · ${esc(p.note||"")}</span></div>`; }).join("")}</div>`);
  const ev = evOf(id);
  if (ev.length) out.push(`<div class="blk"><h4>待取证 ${ev.length} 项</h4>${ev.map(e => `<div class="ev"><span class="mono">${e.id}</span><span class="lv">${e.st} ${esc(e.lv)}</span><span>${esc(e.w)}</span></div>`).join("")}</div>`);
  return out.join("");
}

function taskRow(id){
  const t = T[id], pd = pending(id), ks = kids(id), ev = evOf(id);
  const openKids = ks.filter(k => T[k].s !== "done").length;
  const right = [statePill(id), who(t), ...(t.pr||[]).map(prLink),
    pd.length ? `<span class="tag warn">等 ${pd.length}</span>` : "",
    ks.length ? `<span class="tag">修正 ${openKids}/${ks.length}</span>` : "",
    ev.length ? `<span class="tag">取证 ${ev.length}</span>` : ""].join(" ");
  return `<details class="task" id="${domId(id)}" data-id="${esc(id)}"><summary><span class="chev" aria-hidden="true">▶</span><span class="tl"><span class="tid">${esc(id)}</span><span>${esc(t.n)}</span></span><span class="tr">${right}</span></summary><div class="detail">${detail(id)}</div></details>`;
}

const mainTasks = ms => Object.keys(T).filter(id => !isF(id) && T[id].ms === ms);
document.getElementById("tree").innerHTML = DATA.stages.map(st => {
  const ids = st.ms.flatMap(mainTasks), done = ids.filter(i => T[i].s === "done").length;
  const rows = st.ms.map(ms => {
    const ts = mainTasks(ms), d = ts.filter(i => T[i].s === "done").length;
    const fx = ts.flatMap(kids).filter(k => T[k].s !== "done").length;
    const ev = ts.flatMap(evOf).length + ts.flatMap(kids).flatMap(evOf).length;
    const act = ts.filter(i => ["active","review"].includes(T[i].s)).length;
    const rd = ts.filter(i => ready(i) && !T[i].hold).length;
    const label = st.ms.length > 1 ? ms : st.k;
    return `<details class="ms" data-ms="${ms}"><summary><span class="chev" aria-hidden="true">▶</span><span class="mk">${label}</span>
      <span class="mt"><span>${esc(DATA.milestones[ms])}</span><span class="tag mono">${d}/${ts.length}</span>${d === ts.length ? pill("done") : ""}</span>
      <span class="mr">${act ? `<span class="pill s-active">进行中 ${act}</span>` : ""}${rd ? `<span class="pill s-ready">可派发 ${rd}</span>` : ""}${fx ? `<span class="tag">修正 ${fx}</span>` : ""}${ev ? `<span class="tag">取证 ${ev}</span>` : ""}</span></summary>
      <div class="tasks">${ts.map(taskRow).join("")}</div></details>`;
  }).join("");
  return `<div class="stage"><div class="stage-h"><b>${st.k} ${esc(st.t)}</b><span class="mono sub">${done}/${ids.length} 完成</span><span class="bar"><i style="width:${Math.round(done / ids.length * 100)}%"></i></span></div>${rows}</div>`;
}).join("");

/* 依赖主线 */
document.getElementById("lanes").innerHTML = DATA.lanes.map(l => {
  const flow = l.steps.map(step => `<div class="step">${step.map(id => {
    const t = T[id], p = pending(id), r = ready(id) && !t.hold;
    const cls = t.s === "todo" ? (p.length ? " wait" : (r ? " ready" : "")) : "";
    const ctx = isF(id) ? `修正 ${t.parent} · ${msOf(id)}` : msOf(id);
    const w = p.length ? `等 ${p.join("、")}` : (t.hold ? "暂缓：" + t.hold : (t.pr ? "PR " + t.pr.map(n => "#" + n).join(" ") : ""));
    return `<button class="node${cls}" type="button" data-go="${esc(id)}"><span class="nid">${esc(id)} ${statePill(id)}</span><span class="ms-tag">${esc(ctx)}</span><span>${esc(t.n)}</span>${w ? `<span class="w">${esc(w)}</span>` : ""}</button>`;
  }).join("")}</div>`).join(`<div class="arrow" aria-hidden="true">→</div>`);
  return `<div class="lane"><div class="ln"><b>${esc(l.nm)}</b><span>${esc(l.d)}</span></div><div class="flow">${flow}</div></div>`;
}).join("");

/* 长流程 PR：未合并且达 3 轮 */
const longs = Object.entries(DATA.prs).filter(([n, p]) => p.s !== "done" && p.round >= 3 && p.rounds);
document.getElementById("longpr-sec").hidden = !longs.length;
document.getElementById("longpr").innerHTML = longs.map(([n, p]) => `<div class="longpr"><div class="row"><b class="mono">${prLink(n)}</b><span>${esc(p.t)}</span>${pill(p.s)}<span class="tag">第 ${p.round} 轮</span></div>
  <ol class="rounds">${p.rounds.map(r => `<li><span class="rk">${esc(r.k)}<time>${esc(r.t)}</time></span><span>${esc(r.d)}</span></li>`).join("")}</ol></div>`).join("");

/* 最近动态 */
const logEl = document.getElementById("log"), moreBtn = document.getElementById("logmore");
function drawLog(all){ logEl.innerHTML = DATA.log.slice(0, all ? undefined : 10).map(x => `<li><time>${esc(x.d)}</time><span>${esc(x.t)}</span></li>`).join(""); moreBtn.hidden = all || DATA.log.length <= 10; }
drawLog(false); moreBtn.addEventListener("click", () => drawLog(true));

/* 穿透跳转：打开所在子阶段与任务（修正任务打开其父任务），滚动并高亮 */
function go(id){
  const host = isF(id) ? T[id].parent : id;
  const el = document.getElementById(domId(host)); if (!el) return;
  const ms = el.closest("details.ms"); if (ms) ms.open = true;
  el.open = true;
  const target = document.getElementById(domId(id)) || el;
  target.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"});
  target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b){ e.preventDefault(); go(b.dataset.go); } });

/* 记住展开状态（仅本机浏览器） */
const KEY = "italent-board-open";
let opened = []; try { opened = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
if (!opened.length) opened = DATA.stages.flatMap(s => s.ms).filter(ms => mainTasks(ms).some(i => ["active","review"].includes(T[i].s) || (ready(i) && !T[i].hold))).map(ms => `details.ms[data-ms="${ms}"]`);
opened.forEach(sel => { const el = document.querySelector(sel); if (el) el.open = true; });
document.addEventListener("toggle", () => {
  const list = [...document.querySelectorAll("details.ms[open]")].map(d => `details.ms[data-ms="${d.dataset.ms}"]`)
    .concat([...document.querySelectorAll("details.task[open]")].map(d => "#" + d.id));
  try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
}, true);
</script>
